
name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Postavi Android SDK i NDK
        run: |
          # Skidamo SDK i NDK direktno
          sudo apt-get update
          sudo apt-get install -y wget unzip
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          unzip -q commandlinetools-linux-11076708_latest.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          mv android-ndk-r26d $HOME/android-ndk
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-33" "build-tools;34.0.0"

      - name: Kompajliraj C++ kod
        run: |
          export ANDROID_NDK=$HOME/android-ndk
          export ANDROID_HOME=$HOME/android-sdk
          
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
          cmake --build build

      - name: Napravi APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          
          mkdir -p apk_build/lib/arm64-v8a
          cp build/libmojaigra.so apk_build/lib/arm64-v8a/
          
          mkdir -p apk_build/res/values
          echo '<resources><string name="app_name">Moja Igra</string></resources>' > apk_build/res/values/strings.xml
          
          cat << 'EOF' > apk_build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.aki.mojaigra">
              <application android:label="Moja Igra" android:hasCode="false">
                  <activity android:name="android.app.NativeActivity" android:screenOrientation="portrait">
                      <meta-data android:name="android.app.lib_name" android:value="mojaigra" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          cd apk_build
          $ANDROID_HOME/build-tools/34.0.0/aapt2 link -o app.apk -I $ANDROID_HOME/platforms/android-33/android.jar --manifest AndroidManifest.xml -R res/values/strings.xml
          zip -r app.apk lib/

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: MojaIgra-APK
          path: apk_build/app.apk
